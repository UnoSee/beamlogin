<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">{{REFRESH}}
<title>{{TITLE}} · Beamlogin</title>
<style nonce="{{NONCE}}">{{CSS}}</style></head>
<body data-mode="{{MODE}}" data-host="{{HOST}}"><main>
<header class="top"><div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/></svg></div><div>
<h1>{{TITLE}}</h1>
<p class="sub">on <span class="chip"><i></i>{{HOST}}</span></p></div></header>
{{BODY}}
<footer><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><span><b>Beamlogin</b> &middot; one-time link &middot; stays on your network</span></footer>
</main>
<template id="i-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></template><template id="i-bad"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></template><template id="i-info"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></template>
<script nonce="{{NONCE}}">{{JS}}</script></body></html>
