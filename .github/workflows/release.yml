# Build every binary, test it on each operating system, and publish a release for version tags.
#
#   push to main / pull request  ->  build + tests
#   push a tag like v0.4.0-beta.1 ->  build + tests + GitHub release
#                                     (a tag with a hyphen becomes a pre-release)
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Build the cross-compile toolchain
        run: docker build -t beamlogin-build build

      - name: Build all binaries
        run: docker run --rm -v "$PWD:/src" beamlogin-build sh build/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: beamlogin-x86_64-linux
          - os: ubuntu-24.04-arm
            bin: beamlogin-aarch64-linux
          - os: macos-latest
            bin: beamlogin-aarch64-macos
          - os: macos-15-intel
            bin: beamlogin-x86_64-macos
          - os: windows-latest
            bin: beamlogin-x86_64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make binaries executable
        if: runner.os != 'Windows'
        run: chmod +x dist/*
      - name: End-to-end tests
        env:
          BEAMLOGIN_BIN: dist/${{ matrix.bin }}
        run: python tests/test_flows.py

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Checksums
        run: cd dist && sha256sum beamlogin-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Beamlogin $GITHUB_REF_NAME" \
            --generate-notes $flags
